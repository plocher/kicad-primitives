[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-primitives"
version = "0.0.0"
description = "Shared KiCad project and library Python services (read, edit, write, kicad-cli facade)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "John Plocher" }]
keywords = ["kicad", "eda", "schematic", "pcb", "s-expression"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
# ADR 0003: the verified initial lossless parser; private implementation detail.
dependencies = ["circuitdk-lossless-sexpr==0.1.1"]

[project.urls]
Homepage = "https://github.com/plocher/kicad-primitives"
Repository = "https://github.com/plocher/kicad-primitives"
Issues = "https://github.com/plocher/kicad-primitives/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kicad_primitives = ["py.typed"]
